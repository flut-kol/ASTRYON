<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRYON Admin</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
header{background:#1b1f24;color:#fff;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header a,header button{color:#fff;background:none;border:0;cursor:pointer;font:inherit;text-decoration:none;padding:.2rem .5rem}
header a.active{border-bottom:2px solid #6cf}
main{padding:1rem;max-width:960px;margin:auto}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #dde;padding:.4rem .6rem;text-align:left}
.cards{display:flex;gap:1rem;flex-wrap:wrap}.card{background:#fff;padding:1rem;border:1px solid #dde;min-width:140px}
.card b{display:block;font-size:1.5rem}.error{background:#fee;border:1px solid #c33;padding:.6rem}
.ok{color:#080}.bad{color:#c00}.warn{color:#b60}
</style></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
