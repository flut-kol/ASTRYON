openapi: 3.1.0
info:
  title: ASTRYON File Upload API
  version: 1.0.0
  description: |
    Direct-to-S3 multipart file upload (DPP-031). The client creates a session, uploads each part straight to the
    pre-signed URL, then completes the upload; the service verifies the declared SHA-256 and size and queues a
    `process_file` job. The tenant is taken only from the validated access token; a `tenant_id` field (or any unknown
    field) in a body is rejected. Another tenant's file object id is reported as 404.
servers:
  - url: http://localhost:8085
security:
  - bearer: []
paths:
  /v1/files/uploads:
    get:
      operationId: listUploads
      summary: List the tenant's uploads (newest first, keyset pagination)
      description: |
        Requires scope `astryon:uploads:write`. The tenant comes only from the token (plus row-level security). Results are ordered
        by `created_at DESC, id DESC`; pass `next_cursor` back as `cursor` for the next page (opaque, stable under inserts).
        Unknown or repeated single-value query parameters, and bad values, return 400 `BODY_INVALID`. Items carry labels
        (names and counts) only, never matched values. Files without a job yet have no `job`.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
        - { name: source_type, in: query, schema: { type: string } }
        - { name: sensitivity, in: query, schema: { type: string, enum: [public, internal, restricted] } }
        - name: status
          in: query
          description: Status of the latest job; `QUARANTINED` lists files held back by the credentials policy.
          schema: { type: string, enum: [NEW, QUEUED, RUNNING, RETRYING, SUCCEEDED, FAILED, CANCELLED, QUARANTINED] }
        - { name: label, in: query, description: Latest job carries this content label., schema: { type: string, enum: [contains_geo, contains_credentials, contains_pii] } }
        - name: tag
          in: query
          description: '`key` or `key:value`; repeatable up to 5 times, all must match (AND). The value may itself contain `:`.'
          schema: { type: array, maxItems: 5, items: { type: string } }
          style: form
          explode: true
        - { name: created_from, in: query, description: Inclusive RFC 3339 lower bound., schema: { type: string, format: date-time } }
        - { name: created_to, in: query, description: Exclusive RFC 3339 upper bound., schema: { type: string, format: date-time } }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/UploadListItem' } }
                  next_cursor: { type: string, description: Absent on the last page. }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUpload
      summary: Create a multipart upload session
      description: Requires scope `astryon:uploads:write`. Part URLs are valid for 15 minutes and are per part (HTTP PUT, no extra headers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUpload' }
      responses:
        '201':
          description: Session created and file object registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '409':
          description: The same tenant, filename and SHA-256 were already registered (`ALREADY_REGISTERED`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: The declared `size_bytes` exceeds the tenant's maximum file size (`FILE_TOO_LARGE`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: The source does not exist for this tenant (`SOURCE_UNKNOWN`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: |
            Per-tenant upload quota reached: `TOO_MANY_UPLOADS` (too many concurrently open, uncompleted uploads; `Retry-After: 60`)
            or `UPLOAD_QUOTA` (declared bytes in the last 24 hours would exceed the daily quota; `Retry-After: 3600`).
            Defaults come from service configuration and can be overridden per tenant in `tenant_quotas`
            (`upload_file_max_bytes`/`upload_open_max` with period `total`, `upload_bytes` with period `day`).
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retrying }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/files/uploads/{id}:
    get:
      operationId: getUpload
      summary: Read an upload's tags, sensitivity, source type and content labels
      description: |
        Requires scope `astryon:uploads:write`. `job.labels` come from the content classifier: per-label match counts and
        column/field names only, never matched values. `job.status` is `QUARANTINED` when a content policy held the file back
        (nothing reached the sink; sensitivity was raised to `restricted`); `job.error` then carries the catalog code.
        `profile` is declared handling metadata of the source type; retention, read scope and export are not enforced yet.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The file object
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadInfo' } } }
        '404':
          description: Not found for this tenant (`NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/files/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Complete the upload, verify it and queue processing
      description: |
        Requires scope `astryon:uploads:write`. Idempotent: repeating the call after success returns the same job.
        Send the ETag header value returned by each part PUT, in part order starting at 1.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUpload' }
      responses:
        '200':
          description: Verified and committed; processing job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completed' }
        '422':
          description: |
            `CHECKSUM_MISMATCH` (content differs from the declared SHA-256/size; the object was deleted, create a new upload) or
            `UPLOAD_INCOMPLETE` (missing parts or wrong ETags; re-upload the parts and retry).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/files/uploads/{id}/preview:
    post:
      operationId: previewFileEdit
      summary: Preview a spreadsheet-prep ops pipeline against a bounded sample of the file
      description: |
        Requires scope `astryon:uploads:write`. The file must be committed and `text/csv`. Applies `ops` in order
        (rename, split, merge, find/replace, delete, reorder, trim, drop-empty-rows) to up to `limit` kept rows and
        returns the resulting header/rows without writing anything. This endpoint never enqueues a job and is not
        wired into ClickHouse ingestion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
      responses:
        '200':
          description: Preview result
          content: { application/json: { schema: { $ref: '#/components/schemas/PreviewResult' } } }
        '404':
          description: Not found for this tenant (`NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: The file upload is not committed yet (`FILE_NOT_COMMITTED`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: |
            `UNSUPPORTED_CONTENT_TYPE` (only `text/csv` can be previewed/edited) or `OPS_INVALID` (unknown column,
            bad regex, a naming collision, or a malformed op).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/files/uploads/{id}/versions:
    get:
      operationId: listFileEditVersions
      summary: List saved edit versions of a file (newest first)
      description: Requires scope `astryon:uploads:write`. Capped at 100 rows; items omit `download_url` (fetch a single version for a fresh link).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One page (no further pagination)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/FileEditVersion' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: saveFileEditVersion
      summary: Apply a spreadsheet-prep ops pipeline to the whole file and save the result as a new version
      description: |
        Requires scope `astryon:uploads:write`. Writes a new, checksummed S3 object (never mutates the original) and
        records it under a new `version_number`. The response includes a presigned `download_url` valid for 15
        minutes. Nothing here is loaded into ClickHouse or enqueued as a processing job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveVersionRequest' }
      responses:
        '201':
          description: Version saved
          content: { application/json: { schema: { $ref: '#/components/schemas/FileEditVersion' } } }
        '404':
          description: Not found for this tenant (`NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`FILE_NOT_COMMITTED` or `VERSION_CONFLICT` (concurrent save claimed the version number; retry).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: The edited output exceeds the configured size limit (`EDIT_TOO_LARGE`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: '`UNSUPPORTED_CONTENT_TYPE` or `OPS_INVALID`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/files/uploads/{id}/versions/{versionId}:
    get:
      operationId: getFileEditVersion
      summary: Read one saved edit version, with a fresh download link
      description: Requires scope `astryon:uploads:write`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The version
          content: { application/json: { schema: { $ref: '#/components/schemas/FileEditVersion' } } }
        '404':
          description: Not found for this tenant (`NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "AAS access token with scope `astryon:uploads:write` (`Authorization: DPoP` with a proof where DPoP is enabled)."
  responses:
    Error:
      description: |
        400 BODY_INVALID (malformed JSON, unknown field, bad uuid/sha256/size/parts/content type or extension for the source type, bad tags/sensitivity, missing required tag); 401 UNAUTHENTICATED;
        403 FORBIDDEN; 404 NOT_FOUND (also another tenant's id); 409 FILE_NOT_COMMITTED / VERSION_CONFLICT; 413 FILE_TOO_LARGE / EDIT_TOO_LARGE;
        422 OPS_INVALID / UNSUPPORTED_CONTENT_TYPE; 429 TOO_MANY_UPLOADS / UPLOAD_QUOTA; 502 STORAGE_UNAVAILABLE; 503 UNAVAILABLE.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CreateUpload:
      type: object
      required: [source_id, filename, content_type, sha256, size_bytes, parts]
      unevaluatedProperties: false
      properties:
        source_id: { type: string, format: uuid }
        filename: { type: string, description: A plain file name; path separators and `..` are rejected. }
        content_type: { type: string, description: 'Must be allow-listed by the deployment (default application/x-ndjson, text/csv).' }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        size_bytes: { type: integer, minimum: 1, description: Bounded by the deployment (default 5 GiB). }
        parts: { type: integer, minimum: 1, description: 'Bounded by the deployment (default 1000, S3 maximum 10000); every part except the last must be at least 5 MiB.' }
        source_type:
          type: string
          description: |
            Processing profile. Unknown or omitted values use `unknown` (all detectors, credentials policy from the deployment default).
            The profile fixes allowed content types and extensions, classifier detectors, credentials/geo/PII policies
            (allow|tag|quarantine|block), sensitivity default and floor, required tags, size/row/column/line limits.
          enum: [unknown, telemetry, geo, report, export, config, log, credentials_bundle, personal_data, financial, media_meta, reference]
        tags:
          type: object
          maxProperties: 16
          description: Keys `^[a-z][a-z0-9_.-]{0,31}$`; values up to 64 characters from `[A-Za-z0-9_.:/@+ -]`. Some profiles require tags (e.g. `purpose`).
          additionalProperties: { type: string, maxLength: 64 }
        sensitivity:
          type: string
          enum: [public, internal, restricted]
          description: Defaults to the profile's default (usually `internal`); values below the profile's floor are raised to the floor.
    UploadSession:
      type: object
      required: [file_object_id, upload_id, part_urls, expires_at]
      properties:
        file_object_id: { type: string, format: uuid }
        upload_id: { type: string }
        part_urls: { type: array, items: { type: string, format: uri }, description: PUT URL for part 1..n in order. }
        expires_at: { type: string, format: date-time }
    Labels:
      type: object
      description: Content labels. Counts and field names only; matched values are never stored or returned.
      propertyNames: { enum: [contains_geo, contains_credentials, contains_pii] }
      additionalProperties:
        type: object
        required: [count, fields]
        properties:
          count: { type: integer, minimum: 1 }
          fields: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
    UploadListItem:
      type: object
      required: [file_object_id, source_id, source_type, committed, size_bytes, sensitivity, tags, created_at]
      properties:
        file_object_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        source_type: { type: string }
        committed: { type: boolean }
        size_bytes: { type: integer }
        sensitivity: { type: string, enum: [public, internal, restricted] }
        tags: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        job:
          type: object
          required: [id, status, labels]
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
            error: { type: string }
            labels: { $ref: '#/components/schemas/Labels' }
    UploadInfo:
      type: object
      required: [file_object_id, source_id, source_type, committed, size_bytes, sensitivity, tags, profile]
      properties:
        file_object_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        source_type: { type: string }
        committed: { type: boolean }
        size_bytes: { type: integer }
        sensitivity: { type: string, enum: [public, internal, restricted] }
        tags: { type: object, additionalProperties: { type: string } }
        profile:
          type: object
          properties:
            retention_class: { type: string }
            required_read_scope: { type: string }
            export_allowed: { type: boolean }
        job:
          type: object
          description: Latest `process_file` job, absent until the upload is completed.
          required: [id, status, labels]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [QUEUED, RUNNING, RETRYING, SUCCEEDED, FAILED, CANCELLED, QUARANTINED] }
            error: { type: string, description: 'Catalog code, e.g. CREDENTIALS_DETECTED, PII_DETECTED, GEO_COORDINATES_REQUIRED, SCHEMA_VIOLATION, ROW_LIMIT_EXCEEDED.' }
            labels: { $ref: '#/components/schemas/Labels' }
    CompleteUpload:
      type: object
      required: [upload_id, parts]
      unevaluatedProperties: false
      properties:
        upload_id: { type: string, maxLength: 512 }
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [number, etag]
            unevaluatedProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              etag: { type: string, maxLength: 256 }
    Completed:
      type: object
      required: [file_object_id, status, job_id]
      properties:
        file_object_id: { type: string, format: uuid }
        status: { const: committed }
        job_id: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OpSpec:
      type: object
      required: [type]
      unevaluatedProperties: false
      description: One spreadsheet-prep pipeline step. Column references are resolved against the header as it
        stands after the preceding steps, so a later op can refer to a column a previous rename/split introduced.
      properties:
        type: { type: string, enum: [rename_column, split_column, merge_columns, find_replace, delete_column, reorder_columns, trim_whitespace, drop_empty_rows] }
        column: { type: string, description: 'rename_column, split_column, find_replace (scoped), trim_whitespace (scoped).' }
        columns: { type: array, items: { type: string }, description: 'merge_columns, in join order.' }
        new_name: { type: string, description: rename_column. }
        new_column: { type: string, description: merge_columns result name. }
        separator: { type: string, description: merge_columns join separator. }
        delimiter: { type: string, description: split_column; a literal substring, never a regex. }
        new_columns: { type: array, minItems: 2, items: { type: string }, description: split_column result names. }
        drop_original: { type: boolean, description: split_column, merge_columns. }
        all_columns: { type: boolean, description: find_replace, trim_whitespace scope. }
        find: { type: string }
        replace: { type: string }
        regex: { type: boolean }
        case_sensitive: { type: boolean }
        order: { type: array, items: { type: string }, description: 'reorder_columns: full target permutation of the current header.' }
    FormatOptions:
      type: object
      properties:
        input_header_row: { type: boolean, default: true }
        output_header_row: { type: boolean, default: true }
        output_delimiter: { type: string, minLength: 1, maxLength: 1, default: ',', description: "Single character, e.g. ',' or a tab." }
    PreviewRequest:
      allOf:
        - { $ref: '#/components/schemas/FormatOptions' }
        - type: object
          required: [ops]
          unevaluatedProperties: false
          properties:
            ops: { type: array, items: { $ref: '#/components/schemas/OpSpec' } }
            input_header_row: { type: boolean }
            output_header_row: { type: boolean }
            output_delimiter: { type: string }
            limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
    SaveVersionRequest:
      allOf:
        - { $ref: '#/components/schemas/FormatOptions' }
        - type: object
          required: [ops]
          unevaluatedProperties: false
          properties:
            ops: { type: array, items: { $ref: '#/components/schemas/OpSpec' } }
            input_header_row: { type: boolean }
            output_header_row: { type: boolean }
            output_delimiter: { type: string }
            filename: { type: string, description: 'Defaults to the original filename; must match ^[A-Za-z0-9][A-Za-z0-9_.-]{0,254}$.' }
    PreviewResult:
      type: object
      required: [header, rows, truncated, warnings]
      properties:
        header: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: { type: string } } }
        truncated: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [row_number, message]
            properties:
              row_number: { type: integer }
              message: { type: string }
    FileEditVersion:
      type: object
      required: [version_id, file_object_id, version_number, header, output_delimiter, header_row, size_bytes, row_count, created_at]
      properties:
        version_id: { type: string, format: uuid }
        file_object_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        header: { type: array, items: { type: string } }
        output_delimiter: { type: string }
        header_row: { type: boolean }
        size_bytes: { type: integer }
        row_count: { type: integer }
        download_url: { type: string, format: uri, description: Present on create/get; omitted from the list, which does not presign. }
        download_expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
