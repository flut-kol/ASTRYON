openapi: 3.1.0
info:
  title: ASTRYON Quarantine API
  version: 1.0.0
  description: |
    Tenant-scoped quarantine browser and bounded replay API (DPP-042). The tenant is taken only from
    validated AAS token claims and is never accepted in request bodies, query parameters, or headers.
    The dry-run endpoint is read-only: it does not publish a replay job or mutate stored data.
servers:
  - url: http://localhost:8085
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: quarantineHealth
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process is serving HTTP; this is not a ClickHouse readiness claim.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /v1/quarantine:
    get:
      operationId: listQuarantine
      summary: List tenant quarantine records using bounded cursor pagination
      description: |
        Requires `astryon:quarantine:read`. Setting `include_original=true` additionally requires
        `astryon:quarantine:read-payload` and returns only the bounded, masked sample stored in ClickHouse.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque tenant-bound keyset cursor returned by the previous page.
          schema: { type: string, maxLength: 2732 }
        - name: include_original
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: One page of tenant-owned quarantine records
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuarantinePage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/quarantine/replays/dry-run:
    post:
      operationId: planQuarantineReplay
      summary: Count a bounded replay selection without side effects
      description: |
        Requires `astryon:quarantine:replay`. The selection uses ClickHouse deviation-journal fields:
        `source_id`, a half-open occurred-at range, and the pipeline version that produced the deviation.
        It is not an offset-based replay because the current journal does not store Kafka partition/offset.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayDryRunRequest' }
      responses:
        '200':
          description: Read-only replay plan. No job has been created or published.
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayDryRunPlan' }
        default: { $ref: '#/components/responses/Error' }
  /v1/quarantine/replays:
    post:
      operationId: publishQuarantineReplay
      summary: Publish a bounded tenant quarantine replay job
      description: |
        Requires the separate `astryon:quarantine:replay-publish` scope. The service repeats the
        tenant-bound plan, requires an exact count of at most 10000, writes a durable prepared audit
        event, and only then publishes to `quarantine.replay.jobs.v1`. This is intentionally distinct
        from the incompatible DPP-043 `replay.jobs.v1` processing-version contract.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayDryRunRequest' }
      responses:
        '202':
          description: The bounded replay job was acknowledged by Kafka.
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayQueued' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: AAS access token with the operation-specific quarantine scope.
  headers:
    RequestId: { schema: { type: string, maxLength: 64 } }
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
  responses:
    Error:
      description: |
        400 INVALID_REQUEST; 401 UNAUTHENTICATED; 403 FORBIDDEN; 415 INVALID_REQUEST;
        422 REPLAY_SCOPE_TOO_LARGE; 502 REPLAY_PUBLISH_FAILED; 503 QUARANTINE_UNAVAILABLE,
        REPLAY_UNAVAILABLE, or AUDIT_UNAVAILABLE.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    QuarantineRecord:
      type: object
      required: [id, reason_code, stage, quarantined_at]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{32}$' }
        source_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        processing_version: { type: integer, minimum: 1 }
        pipeline_version: { type: integer, minimum: 1 }
        reason_code: { type: string }
        reason: { type: string }
        stage: { type: string }
        quarantined_at: { type: string, format: date-time }
        original: { description: Bounded masked sample; present only when separately authorized. }
        payload_kind: { const: masked_sample }
    QuarantinePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/QuarantineRecord' }
        next_cursor: { type: string, description: Empty on the last page. }
    ReplayDryRunRequest:
      type: object
      required: [source_id, occurred_from, occurred_to, pipeline_version]
      unevaluatedProperties: false
      properties:
        source_id: { type: string, format: uuid }
        occurred_from: { type: string, format: date-time }
        occurred_to:
          type: string
          format: date-time
          description: Exclusive; occurred_to - occurred_from must not exceed 31 days.
        pipeline_version:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: Version that produced the quarantined deviation, not a target replay version.
    ReplayDryRunPlan:
      type: object
      required:
        [dry_run, source_id, occurred_from, occurred_to, pipeline_version, candidate_count,
         candidate_count_is_lower_bound, executable]
      properties:
        dry_run: { const: true }
        source_id: { type: string, format: uuid }
        occurred_from: { type: string, format: date-time }
        occurred_to: { type: string, format: date-time }
        pipeline_version: { type: integer, minimum: 1 }
        candidate_count: { type: integer, minimum: 0, maximum: 10000 }
        candidate_count_is_lower_bound:
          type: boolean
          description: True when the selection contains more than the 10000-candidate execution limit.
        executable:
          type: boolean
          description: False when the candidate limit is exceeded; dry-run itself remains side-effect free.
        reason: { enum: [candidate_limit_exceeded] }
    ReplayQueued:
      type: object
      required: [job_id, status, candidate_count]
      properties:
        job_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Generated replay identifier; never supplied by the caller.
        status: { const: queued }
        candidate_count: { type: integer, minimum: 0, maximum: 10000 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, trace_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            trace_id: { type: string }
