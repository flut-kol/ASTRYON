apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astryon-gateway.fullname" . }}
  labels: {app.kubernetes.io/name: {{ include "astryon-gateway.name" . }}, app.kubernetes.io/part-of: astryon}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "astryon-gateway.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "astryon-gateway.name" . }}, app.kubernetes.io/part-of: astryon}
    spec:
      serviceAccountName: {{ include "astryon-gateway.serviceAccountName" . }}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: {{ .key }}}}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
