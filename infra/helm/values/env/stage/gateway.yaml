# stage overrides. Pin image.tag to an immutable tag/digest (CI updates it).
image: {tag: "stage-latest"}
replicaCount: 2
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 4}
pdb: {enabled: true, minAvailable: 1}
config:
  AAS_BASE_URL: https://aas.stage.astryon.example
  ASTRYON_AAS_AUDIENCE: astryon-gateway-stage
  ASTRYON_KAFKA_BROKERS: kafka-0.kafka.astryon-kafka.svc:9093,kafka-1.kafka.astryon-kafka.svc:9093,kafka-2.kafka.astryon-kafka.svc:9093
serviceMonitor: {enabled: false}
