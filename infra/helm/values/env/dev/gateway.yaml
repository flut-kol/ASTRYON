# dev overrides. Pin image.tag to an immutable tag/digest (CI updates it).
image: {tag: "dev-latest"}
replicaCount: 1
autoscaling: {enabled: false, minReplicas: 1, maxReplicas: 2}
pdb: {enabled: false, minAvailable: 1}
config:
  AAS_BASE_URL: https://aas.dev.astryon.example
  ASTRYON_AAS_AUDIENCE: astryon-gateway-dev
  ASTRYON_KAFKA_BROKERS: kafka-0.kafka.astryon-kafka.svc:9093,kafka-1.kafka.astryon-kafka.svc:9093,kafka-2.kafka.astryon-kafka.svc:9093
serviceMonitor: {enabled: false}
