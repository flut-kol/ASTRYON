# prod overrides. Pin image.tag to an immutable tag/digest (CI updates it).
image: {tag: "prod-latest"}
replicaCount: 3
autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 10}
pdb: {enabled: true, minAvailable: 1}
config:
  AAS_BASE_URL: https://aas.prod.astryon.example
  ASTRYON_AAS_AUDIENCE: astryon-gateway-prod
  ASTRYON_KAFKA_BROKERS: kafka-0.kafka.astryon-kafka.svc:9093,kafka-1.kafka.astryon-kafka.svc:9093,kafka-2.kafka.astryon-kafka.svc:9093
serviceMonitor: {enabled: false}
