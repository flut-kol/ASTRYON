# Generic defaults. Per-service values: infra/helm/values/<service>.yaml;
# per-env overrides: infra/helm/values/env/<env>/<service>.yaml. No secret values here.
nameOverride: ""
fullnameOverride: ""
replicaCount: 2
image:
  repository: ghcr.io/astryon/service   # overridden per service
  tag: ""                                # defaults to .Chart.AppVersion; pin by digest/tag in env values
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  automount: false
podAnnotations: {}
podLabels: {}
containerPort: 8080
portName: http
# Service exposed only when service.enabled (clickhouse-sink has no inbound API)
service:
  enabled: true
  type: ClusterIP
  port: 80
# Extra container ports (e.g. metrics)
extraPorts: []   # - {name: metrics, containerPort: 9100}
# Non-secret config, rendered to ConfigMap and mounted via envFrom
config: {}
# Extra env (plain values or valueFrom). Never put secret values here.
env: []
# envFrom secrets/configmaps by name (secrets are created out-of-band: ESO/SealedSecrets/Vault)
secretRefs: []     # - name: gateway-secrets
envFromConfigMaps: []
# Optional secret file mounts (e.g. Kafka CA) read-only
secretMounts: []   # - {name: kafka-ca, secretName: kafka-ca, mountPath: /etc/astryon/kafka-ca}
args: []
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 256Mi}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
probes:
  liveness:
    enabled: true
    httpGet: {path: /healthz, port: http}
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    httpGet: {path: /healthz, port: http}
    initialDelaySeconds: 2
    periodSeconds: 5
  startup:
    enabled: false
terminationGracePeriodSeconds: 30
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
  maxSkew: 1
nodeSelector: {}
tolerations: []
affinity: {}
serviceMonitor:
  enabled: false     # requires prometheus-operator CRDs
  port: http
  path: /metrics
  interval: 30s
networkPolicy:
  enabled: true
  ingress:
    # list of NetworkPolicyIngressRule fragments "from" selectors; empty = no ingress
    from: []         # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  # Allow Prometheus to scrape the metrics port (only that port) from the monitoring namespace
  metrics:
    port: null       # e.g. 9101
    from: []         # - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  egress:
    allowDNS: true
    # additional egress rules (raw NetworkPolicyEgressRule list), e.g. Kafka/ClickHouse/AAS
    rules: []
