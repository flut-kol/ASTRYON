[defaults]
inventory = inventories/dev/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
forks = 20
interpreter_python = auto_silent
# Vault password is read from a file OUTSIDE the repo; never commit it.
# vault_password_file = ~/.astryon-vault-pass

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
