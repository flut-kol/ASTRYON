---
- name: Apply ASTRYON OS baseline
  hosts: astryon_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require Debian-family hosts
      ansible.builtin.assert:
        that: [ansible_facts.os_family == 'Debian']
        fail_msg: Add an explicit baseline for non-Debian hosts.
    - name: Refuse an SSH lockout
      ansible.builtin.assert:
        that:
          - astryon_admin_users | length > 0
          - astryon_admin_users | selectattr('name', 'defined') | list | length == astryon_admin_users | length
          - astryon_admin_users | selectattr('ssh_public_key', 'defined') | list | length == astryon_admin_users | length
        fail_msg: Define a key-based administrator before disabling SSH passwords.
      when: astryon_sshd_password_authentication == 'no'
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: [ca-certificates, chrony, curl, nftables, sudo]
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [os]
    - name: Set timezone
      ansible.builtin.command: "timedatectl set-timezone {{ astryon_timezone }}"
      changed_when: false
      tags: [os]
    - name: Create administrator group
      ansible.builtin.group:
        name: "{{ astryon_admin_group }}"
      tags: [users]
    - name: Create key-only administrator accounts
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ astryon_admin_group }}"
        append: true
        shell: /bin/bash
      loop: "{{ astryon_admin_users }}"
      no_log: true
      tags: [users]
    - name: Install administrator SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_public_key }}"
      loop: "{{ astryon_admin_users }}"
      no_log: true
      tags: [users]
    - name: Grant administrators sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-astryon-admins
        content: "%{{ astryon_admin_group }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      tags: [users]
    - name: Install SSH hardening drop-in
      ansible.builtin.template:
        src: templates/60-astryon.conf.j2
        dest: /etc/ssh/sshd_config.d/60-astryon.conf
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: restart ssh
      tags: [hardening]
    - name: Configure chrony
      ansible.builtin.template:
        src: templates/chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        mode: '0644'
      notify: restart chrony
      tags: [ntp]
    - name: Enable chrony
      ansible.builtin.service:
        name: chrony
        enabled: true
        state: started
      tags: [ntp]
    - name: Create mount points
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: '0755'
      loop: "{{ astryon_mounts }}"
      tags: [disks]
    - name: Mount existing data filesystems
      ansible.posix.mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts | default('defaults') }}"
        state: mounted
      loop: "{{ astryon_mounts }}"
      tags: [disks]
    - name: Validate requested interfaces
      ansible.builtin.assert:
        that: item.name in ansible_facts.interfaces
        fail_msg: "Interface {{ item.name }} does not exist"
      loop: "{{ astryon_interfaces }}"
      tags: [interfaces]
    - name: Write opt-in netplan configuration
      ansible.builtin.template:
        src: templates/60-astryon-interfaces.yaml.j2
        dest: /etc/netplan/60-astryon-interfaces.yaml
        mode: '0600'
      when: astryon_interfaces | length > 0
      notify: apply netplan
      tags: [interfaces]
    - name: Configure kernel and resource sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-astryon.conf
        content: |
          {% for key, value in astryon_sysctl | dictsort %}
          {{ key }} = {{ value }}
          {% endfor %}
        mode: '0644'
      notify: reload sysctl
      tags: [sysctl]
    - name: Install allow-list firewall when explicitly enabled
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: '0644'
        validate: /usr/sbin/nft -c -f %s
      when: astryon_enable_firewall | bool
      notify: reload nftables
      tags: [hardening]
  handlers:
    - name: restart ssh
      ansible.builtin.service: { name: ssh, state: restarted }
    - name: restart chrony
      ansible.builtin.service: { name: chrony, state: restarted }
    - name: reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
    - name: apply netplan
      ansible.builtin.command: netplan apply
      changed_when: true
      when: astryon_apply_network | bool
    - name: reload nftables
      ansible.builtin.service: { name: nftables, state: reloaded }
