---
- name: Install hardening packages
  ansible.builtin.apt:
    name: [auditd, audispd-plugins, nftables, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/90-astryon.rules
    mode: "0640"
  notify: Restart auditd

- name: Enable auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: nftables ruleset with role-based allow lists
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  when: firewall_enabled | bool
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
  when: firewall_enabled | bool

- name: Unattended security updates (security origin only)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52astryon-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable periodic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
