---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Enable disable-thp
  ansible.builtin.systemd:
    name: disable-thp.service
    daemon_reload: true
    enabled: true
    state: started

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
