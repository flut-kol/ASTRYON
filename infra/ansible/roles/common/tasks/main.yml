---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages | unique }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create admin groups
  ansible.builtin.group:
    name: "{{ item.1 }}"
    state: present
  loop: "{{ admin_users | subelements('groups', skip_missing=True) }}"

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    shell: /bin/bash
    state: present
  loop: "{{ admin_users }}"

- name: Authorize admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
  loop: "{{ admin_users | subelements('ssh_keys', skip_missing=True) }}"
  no_log: true

- name: SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-astryon-hardening.conf
    mode: "0644"
    content: |
      Port {{ ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowGroups {{ ssh_allow_groups | join(' ') }}
    validate: "sshd -t -f %s"
  notify: Reload sshd

- name: Sysctl tuning (Kafka/ClickHouse/network)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-astryon.conf
    reload: true
    state: present
  loop: "{{ (sysctl_base | combine(sysctl_extra)) | dict2items }}"

- name: Resource limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-astryon.conf
    mode: "0644"
    content: |
      *    soft nofile {{ limits_nofile }}
      *    hard nofile {{ limits_nofile }}
      *    soft nproc  {{ limits_nproc }}
      *    hard nproc  {{ limits_nproc }}
      root soft nofile {{ limits_nofile }}
      root hard nofile {{ limits_nofile }}

- name: Disable transparent huge pages (persistent unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-thp.service
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages
      After=sysinit.target local-fs.target
      Before=basic.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled; echo never > /sys/kernel/mm/transparent_hugepage/defrag'

      [Install]
      WantedBy=basic.target
  notify: Enable disable-thp

- name: Flush handlers so THP unit is active
  ansible.builtin.meta: flush_handlers

- name: Chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chrony

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
