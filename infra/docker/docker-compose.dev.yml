# ASTRYON dev stack (DPP-006). DEV ONLY: placeholder creds, single node, ports on 127.0.0.1.
# Host ports (chosen to avoid collisions on the dev host; override via .env):
#   Kafka 19092 (plain), Kafka TLS+SASL 19093 (DEVTLS listener, see below) | PostgreSQL 15432 |
#   ClickHouse HTTP 18124, native 19010 | MinIO S3 19200, console 19201
#
# Kafka has a second, additive listener "DEVTLS" (SASL_SSL, SCRAM-SHA-512) on port
# 19093, alongside the original plain EXTERNAL listener on 19092 which is left
# untouched for `make dev-up` / `make topics` / plain dev work. DEVTLS exists to
# exercise services/gateway's TLS+SASL KafkaPublisher path end-to-end:
#   - TLS cert: dev-only self-signed CA + broker cert, generated fresh by
#     scripts/dev/gen-kafka-tls.sh (run automatically by scripts/dev/up.sh) into
#     the gitignored infra/docker/.devcerts/kafka/ directory, in PEM format
#     (ssl.keystore.type=PEM — no keytool/JKS needed, apache/kafka:3.9.0 supports
#     PEM natively per KIP-651). The broker private key is encrypted with the
#     fixed dev-only password below (KAFKA_LISTENER_NAME_DEVTLS_SSL_KEY_PASSWORD).
#   - SASL user: SCRAM-SHA-512 user "astryon_dev" / "astryon_dev_only", provisioned
#     by scripts/dev/provision-kafka-scram.sh (also run automatically by
#     scripts/dev/up.sh) via kafka-configs.sh against the PLAINTEXT INTERNAL
#     listener once the broker is healthy (works for KRaft combined mode without
#     needing `kafka-storage.sh format --add-scram` at bootstrap, since INTERNAL
#     is never SASL-protected).
# See services/gateway/internal/gateway/kafka_tls_sasl_test.go for the env-gated
# integration test that exercises this listener against a real broker.
name: astryon-dev

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
      - "127.0.0.1:${KAFKA_TLS_HOST_PORT:-19093}:19093"
    volumes:
      - kafka_data:/var/lib/kafka/data
      # DEV ONLY: self-signed CA + broker cert generated by scripts/dev/gen-kafka-tls.sh.
      # Read-only; the broker never writes here.
      - ./.devcerts/kafka:/etc/kafka/secrets:ro
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092,DEVTLS://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-19092},DEVTLS://127.0.0.1:${KAFKA_TLS_HOST_PORT:-19093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,DEVTLS:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # DEVTLS: SASL (SCRAM-SHA-512, the mechanism services/gateway's KafkaPublisher
      # already supports) + TLS, configured per-listener so the original INTERNAL/
      # EXTERNAL/CONTROLLER listeners are untouched. Listener name "DEVTLS" is
      # deliberately chosen so it does NOT contain the substrings "SSL://" or
      # "SASL_" — the apache/kafka image's docker/configure script does naive
      # substring matching on KAFKA_ADVERTISED_LISTENERS to decide whether to force
      # a *global* ssl.keystore.password (which PEM-format keystores reject) and a
      # static JAAS login file (which SCRAM in KRaft mode doesn't need); naming the
      # listener this way skips that logic entirely and we configure SSL/SASL for
      # DEVTLS only, via the listener-scoped properties below.
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # listener.name.devtls.scram-sha-512.sasl.jaas.config - triple underscore is
      # this image's env-var convention for a literal "-" (single "_" -> ".",
      # double "__" -> literal "_", triple "___" -> "-"; verified empirically
      # against apache/kafka:3.9.0's kafka.docker.KafkaDockerWrapper).
      KAFKA_LISTENER_NAME_DEVTLS_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      # listener.name.devtls.ssl.keystore.location / .type / .key.password.
      # DEV ONLY placeholder key password; must match scripts/dev/gen-kafka-tls.sh's
      # ASTRYON_KAFKA_TLS_KEY_PASSWORD default. Do NOT also set a keystore password
      # here: Kafka rejects ssl.keystore.password for ssl.keystore.type=PEM.
      KAFKA_LISTENER_NAME_DEVTLS_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.keystore.pem
      KAFKA_LISTENER_NAME_DEVTLS_SSL_KEYSTORE_TYPE: PEM
      KAFKA_LISTENER_NAME_DEVTLS_SSL_KEY_PASSWORD: astryon_dev_only
      # single node: RF=1 everywhere (prod uses RF=3, see infra/kafka/topics.yaml)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astryon_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-astryon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-18124}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:-19010}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-astryon}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-astryon}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-astryon_dev_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_S3_HOST_PORT:-19200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19201}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astryon_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-astryon_dev_only}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kafka_data:
  postgres_data:
  clickhouse_data:
  minio_data:
