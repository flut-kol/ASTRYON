groups:
  - name: astryon-ingestion
    rules:
      - record: astryon:gateway_ack_error_ratio:5m
        expr: |
          sum(rate(astryon_gateway_ack_errors_total[5m]))
          /
          clamp_min(sum(rate(astryon_gateway_ack_total[5m])), 1)
      - alert: AstryonGatewayAckErrors
        expr: astryon:gateway_ack_error_ratio:5m > 0.01
        for: 10m
        labels: { severity: page }
        annotations:
          summary: ASTRYON gateway ACK errors exceed 1 percent
          runbook: docs/operations/runbooks/ingestion-failures.md
      - alert: AstryonKafkaConsumerLagGrowing
        expr: sum by (group, topic) (kafka_consumergroup_lag) > 100000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Kafka consumer lag exceeds 100k records
          runbook: docs/operations/runbooks/stuck-consumer.md
  - name: astryon-platform
    rules:
      - record: astryon:clickhouse_disk_free_ratio
        expr: node_filesystem_avail_bytes{mountpoint="/var/lib/clickhouse"} / node_filesystem_size_bytes{mountpoint="/var/lib/clickhouse"}
      - alert: AstryonClickHouseDiskHigh
        expr: astryon:clickhouse_disk_free_ratio < 0.20
        for: 15m
        labels: { severity: page }
        annotations:
          summary: ClickHouse disk has less than 20 percent free
          runbook: docs/operations/runbooks/clickhouse-disk.md
      - alert: AstryonCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: ASTRYON TLS certificate expires within 14 days
  - name: astryon-clickhouse-sink
    rules:
      - alert: AstryonSinkInsertFailures
        expr: sum(increase(astryon_clickhouse_sink_insert_failures_total[10m])) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: clickhouse-sink exhausted insert retries
          runbook: docs/operations/runbooks/stuck-consumer.md
      - alert: AstryonSinkCommitFailures
        expr: sum(increase(astryon_clickhouse_sink_commit_failures_total[10m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: clickhouse-sink cannot commit Kafka offsets (duplicates possible after restart)
          runbook: docs/operations/runbooks/stuck-consumer.md
      - alert: AstryonSinkQuarantineRising
        expr: sum(rate(astryon_clickhouse_sink_quarantined_total[15m])) / clamp_min(sum(rate(astryon_clickhouse_sink_consumed_total[15m])), 1) > 0.01
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: more than 1 percent of processed events are quarantined by the sink
          runbook: docs/operations/runbooks/ingestion-failures.md
      - alert: AstryonSinkStalled
        expr: sum(rate(astryon_clickhouse_sink_consumed_total[10m])) == 0 and sum(kafka_consumergroup_lag) > 0
        for: 15m
        labels: { severity: page }
        annotations:
          summary: clickhouse-sink consumes nothing while lag exists
          runbook: docs/operations/runbooks/stuck-consumer.md
      - alert: AstryonQueryDPoPReplay
        expr: sum(increase(astryon_query_api_dpop_rejected_total{reason="replay"}[10m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: query-api rejects repeated DPoP proofs (possible token/proof theft or a client retrying proofs)
          runbook: docs/architecture/dpop-plan.md
      - alert: AstryonQueryDPoPRejectsHigh
        expr: sum(rate(astryon_query_api_dpop_rejected_total{reason!="replay"}[15m])) > 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: sustained DPoP proof rejections in query-api (htu/ath/jkt misconfiguration or abuse)
          runbook: docs/architecture/dpop-plan.md
  - name: astryon-query-api
    rules:
      - alert: AstryonQueryBackendErrors
        expr: sum(rate(astryon_query_api_requests_total{outcome="backend_error"}[5m])) / clamp_min(sum(rate(astryon_query_api_requests_total[5m])), 1) > 0.02
        for: 10m
        labels: { severity: page }
        annotations:
          summary: more than 2 percent of query-api requests fail on the ClickHouse backend (502)
      - alert: AstryonQueryThrottling
        expr: sum(rate(astryon_query_api_requests_total{outcome="throttled"}[10m])) / clamp_min(sum(rate(astryon_query_api_requests_total[10m])), 1) > 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: more than 10 percent of query-api requests are rate limited (429)
  - name: astryon-ch-aggregator
    rules:
      - alert: AstryonAggregatorStale
        expr: time() - max(astryon_ch_aggregator_last_success_timestamp_seconds) > 2 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: no successful ch-aggregator recompute for 2 hours (aggregate tables are stale)
      - alert: AstryonAggregatorLastRunFailed
        expr: min(astryon_ch_aggregator_last_run_ok) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: latest ch-aggregator recompute failed
  - name: astryon-file-ingestion
    rules:
      - alert: AstryonFileJobsFailing
        expr: sum(increase(astryon_file_worker_jobs_failed_total[30m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: file jobs ended FAILED (permanent error or retries exhausted); inspect jobs.last_error
          runbook: docs/operations/runbooks/ingestion-failures.md
      - alert: AstryonFileSinkErrors
        expr: sum(rate(astryon_file_worker_sink_errors_total[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: file-worker cannot write to ClickHouse (jobs are retrying with backoff)
          runbook: docs/operations/runbooks/ingestion-failures.md
      - alert: AstryonFileInvalidRecordsHigh
        expr: sum(rate(astryon_file_worker_invalid_records_total[15m])) / clamp_min(sum(rate(astryon_file_worker_records_total[15m])) + sum(rate(astryon_file_worker_invalid_records_total[15m])), 1) > 0.05
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: more than 5 percent of file records are unparseable (processing_errors, stage file_parse)
          runbook: docs/operations/runbooks/ingestion-failures.md
      - alert: AstryonFileLeaseLosses
        expr: sum(increase(astryon_file_worker_jobs_fenced_total[30m])) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: file-worker keeps losing leases (slow ClickHouse/S3 or lease shorter than a batch)
      - alert: AstryonFileApiServerErrors
        expr: sum(rate(astryon_file_api_requests_total{code=~"5.."}[10m])) / clamp_min(sum(rate(astryon_file_api_requests_total[10m])), 1) > 0.05
        for: 10m
        labels: { severity: page }
        annotations:
          summary: more than 5 percent of upload API responses are 5xx (storage or database unavailable)
