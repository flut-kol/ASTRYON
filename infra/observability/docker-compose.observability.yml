# Observability stack (DPP-015). Run: docker compose -f infra/observability/docker-compose.observability.yml up -d
# Scrapes services on the host via host.docker.internal (dev). Ports: Grafana 3000, Prometheus 9090, Alertmanager 9093.
name: astryon-obs
x-host: &host
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *host
    networks: [default, dev]
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=15d","--web.enable-remote-write-receiver","--web.enable-lifecycle"]
    volumes: ["./prometheus:/etc/prometheus:ro","prom-data:/prometheus"]
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317","4318:4318","8889:8889"]
    depends_on: [loki, tempo]
  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro","loki-data:/loki"]
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro","tempo-data:/var/tempo"]
  alloy:
    image: grafana/alloy:v1.5.0
    command: ["run","/etc/alloy/config.alloy"]
    volumes: ["./alloy/config.alloy:/etc/alloy/config.alloy:ro","/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    <<: *host
    networks: [default, dev]
    command: ["--kafka.server=${KAFKA_BROKER:-kafka:9092}"]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    <<: *host
    networks: [default, dev]
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:?set PG_EXPORTER_DSN e.g. postgresql://user:pass@host.docker.internal:5432/astryon?sslmode=disable}
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]
networks:
  dev: {name: astryon-dev_default, external: true}  # dev stack network (scripts/dev/up.sh)
volumes: {prom-data: {}, grafana-data: {}, loki-data: {}, tempo-data: {}}
