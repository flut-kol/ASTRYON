global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: ["/etc/prometheus/rules/*.yml"]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: gateway            # /metrics on ASTRYON_GATEWAY_METRICS_ADDR (e.g. :9101), not the public API port
    metrics_path: /metrics
    static_configs: [{targets: ["host.docker.internal:9101"]}]
  - job_name: clickhouse-sink    # /metrics (Prometheus text) on CHSINK_METRICS_ADDR; expvar JSON also at /debug/vars
    metrics_path: /metrics
    static_configs: [{targets: ["host.docker.internal:9102"]}]
  - job_name: kafka              # kafka-exporter: lag, under-replicated partitions
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: clickhouse         # built-in endpoint: <prometheus><port>9363</port> in server config
    static_configs: [{targets: ["clickhouse:9363"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
