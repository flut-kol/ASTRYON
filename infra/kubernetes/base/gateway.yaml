apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  ASTRYON_GATEWAY_ADDR: ":8080"
  ASTRYON_KAFKA_BROKERS: kafka-bootstrap.kafka.svc:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway }
    spec:
      serviceAccountName: gateway
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: example.invalid/astryon/gateway:0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: gateway-config }
          env:
            - name: AAS_BASE_URL
              valueFrom:
                secretKeyRef: { name: astryon-auth, key: aas-base-url }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
