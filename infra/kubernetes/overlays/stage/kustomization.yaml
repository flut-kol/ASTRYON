apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: astryon-stage
resources:
  - ../../base
labels:
  - pairs: {astryon.io/env: stage}
patches:
  - target: {kind: Namespace, name: astryon}
    patch: |-
      - op: replace
        path: /metadata/name
        value: astryon-stage
  - target: {kind: ResourceQuota, name: astryon-quota}
    patch: |-
      - op: replace
        path: /spec/hard
        value: {requests.cpu: "8", requests.memory: 16Gi, limits.memory: 32Gi, pods: "60"}
