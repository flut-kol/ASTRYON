apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: astryon-dev
resources:
  - ../../base
labels:
  - pairs: {astryon.io/env: dev}
patches:
  - target: {kind: Namespace, name: astryon}
    patch: |-
      - op: replace
        path: /metadata/name
        value: astryon-dev
  - target: {kind: ResourceQuota, name: astryon-quota}
    patch: |-
      - op: replace
        path: /spec/hard
        value: {requests.cpu: "4", requests.memory: 8Gi, limits.memory: 16Gi, pods: "30"}
