apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: astryon-prod
resources:
  - ../../base
labels:
  - pairs: {astryon.io/env: prod}
patches:
  - target: {kind: Namespace, name: astryon}
    patch: |-
      - op: replace
        path: /metadata/name
        value: astryon-prod
  - target: {kind: ResourceQuota, name: astryon-quota}
    patch: |-
      - op: replace
        path: /spec/hard
        value: {requests.cpu: "32", requests.memory: 64Gi, limits.memory: 128Gi, pods: "200"}
