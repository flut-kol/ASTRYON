openapi: 3.1.0
info:
  title: ASTRYON Query API
  version: 1.0.0
paths:
  /v1/query/text:
    post:
      summary: Search file payload tokens for the authenticated tenant
      operationId: queryText
      security:
        - bearerAuth: [astryon:query:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextRequest'
      responses:
        '200':
          description: Metadata-only matching events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextResponse'
        '400': { description: Invalid or unbounded request }
        '401': { description: Missing or invalid credentials }
        '403': { description: Missing query scope or tenant }
        '429': { description: Tenant rate/concurrency limit exceeded }
        '502': { description: ClickHouse backend failure }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    TextRequest:
      type: object
      additionalProperties: false
      required: [from, to, query, processing_version]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        source_id: { type: string, format: uuid }
        processing_version: { type: integer, minimum: 0, format: uint32 }
        query: { type: string, minLength: 1, maxLength: 256, description: One or more ClickHouse token(s) }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        cursor: { type: string }
    TextResponse:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              event_id: { type: string, format: uuid }
              source_id: { type: string, format: uuid }
              batch_id: { type: string, format: uuid }
              processing_version: { type: integer, format: uint32 }
              event_type: { type: string }
              event_time: { type: string, format: date-time }
              entity_id: { type: string }
              quality_flags: { type: integer, format: uint32 }
