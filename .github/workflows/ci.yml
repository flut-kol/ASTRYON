name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  quality:
    name: Go quality and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - name: Format, vet and lint checks
        run: make lint
      - name: Unit and contract tests
        run: make test

  security:
    name: Go SAST and dependency vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261020094257-14ef84f6fecc
      - name: Scan every Go module
        run: |
          find . -name go.mod -not -path './vendor/*' -not -path './node_modules/*' -print0 |
            sort -z |
            while IFS= read -r -d '' mod; do
              module_dir="$(dirname "$mod")"
              (cd "$module_dir" && govulncheck ./... && gosec ./...)
            done

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  sbom:
    name: Generate source SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/astryon.spdx.json
          upload-artifact: false
          upload-release-assets: false
